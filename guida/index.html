<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Guida PaghePro — Come usare il software (passo passo)</title>
<style>
  :root{
    --blu:#2f54ff;
    --blu-scuro:#1b2a6b;
    --blu-chiaro:#eaf0ff;
    --viola:#7b61ff;
    --testo:#1f2a44;
    --grigio:#64708a;
    --bordo:#e3e9f7;
    --ok:#16a34a;
    --giallo:#f59e0b;
    --ombra:0 18px 50px rgba(31,42,68,.14);
    --r:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--testo);
    background:
      radial-gradient(1200px 600px at 10% -10%, #e9eeff 0%, transparent 60%),
      radial-gradient(1000px 600px at 110% 10%, #f1ecff 0%, transparent 55%),
      linear-gradient(160deg,#f6f8ff 0%, #eef1fb 100%);
    min-height:100vh;
    overflow-x:hidden;
  }

  /* ---------- HEADER ---------- */
  header.top{
    position:sticky;top:0;z-index:40;
    display:flex;align-items:center;gap:14px;
    padding:14px 22px;
    background:rgba(255,255,255,.78);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--bordo);
  }
  .logo{display:flex;align-items:center;gap:11px}
  .logo .mark{
    width:38px;height:38px;border-radius:11px;
    background:linear-gradient(140deg,var(--blu),var(--viola));
    color:#fff;font-weight:800;font-size:20px;
    display:grid;place-items:center;
    box-shadow:0 8px 18px rgba(47,84,255,.35);
  }
  .logo b{font-size:18px;letter-spacing:.2px}
  .logo span{display:block;font-size:11px;color:var(--grigio);font-weight:600;letter-spacing:1.5px}
  .top .titolo-guida{margin-left:6px;font-weight:700;color:var(--grigio);font-size:13px}
  .top .spazio{flex:1}

  .ctrl{display:flex;align-items:center;gap:8px}
  .btn{
    border:1px solid var(--bordo);background:#fff;color:var(--testo);
    padding:9px 14px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;transition:.15s;
  }
  .btn:hover{border-color:#c7d2f7;transform:translateY(-1px)}
  .btn.primary{background:linear-gradient(135deg,var(--blu),var(--viola));color:#fff;border:none;box-shadow:0 8px 18px rgba(47,84,255,.32)}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn .dot{width:8px;height:8px;border-radius:50%;background:#fff}
  .toggle{font-size:12px;color:var(--grigio);display:flex;align-items:center;gap:6px;user-select:none;cursor:pointer}
  .toggle input{accent-color:var(--blu);width:15px;height:15px}

  /* ---------- PROGRESS ---------- */
  .progress-wrap{height:5px;background:#e6ebfb;position:relative}
  .progress{height:100%;width:0;background:linear-gradient(90deg,var(--blu),var(--viola));transition:width .5s ease}

  /* ---------- LAYOUT ---------- */
  .shell{display:flex;max-width:1280px;margin:0 auto;padding:18px 18px 90px;gap:22px}
  nav.indice{
    width:225px;flex:none;position:sticky;top:96px;align-self:flex-start;
    background:#fff;border:1px solid var(--bordo);border-radius:var(--r);
    padding:10px;box-shadow:var(--ombra);max-height:calc(100vh - 120px);overflow:auto;
  }
  nav.indice h4{font-size:11px;letter-spacing:1.5px;color:var(--grigio);padding:8px 10px 6px}
  .voce{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;
    cursor:pointer;font-size:13px;font-weight:600;color:#42506e;transition:.12s;
  }
  .voce .ic{width:24px;height:24px;border-radius:8px;background:var(--blu-chiaro);display:grid;place-items:center;font-size:14px;flex:none}
  .voce:hover{background:#f3f6ff}
  .voce.attiva{background:linear-gradient(135deg,var(--blu),var(--viola));color:#fff}
  .voce.attiva .ic{background:rgba(255,255,255,.22)}

  main{flex:1;min-width:0}

  /* ---------- SLIDE ---------- */
  .slide{display:none;animation:entra .55s cubic-bezier(.2,.7,.2,1)}
  .slide.show{display:block}
  @keyframes entra{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

  .badge{
    display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;
    color:var(--blu);background:var(--blu-chiaro);padding:6px 12px;border-radius:999px;margin-bottom:12px;
    letter-spacing:.3px;
  }
  .slide h1{font-size:30px;line-height:1.15;margin-bottom:8px}
  .slide .tagline{color:var(--grigio);font-size:16px;margin-bottom:20px;max-width:760px}

  .doppia{display:grid;grid-template-columns:1.15fr .95fr;gap:26px;align-items:start}
  @media(max-width:900px){.doppia{grid-template-columns:1fr}}

  /* screenshot */
  .schermo{
    position:relative;border-radius:18px;overflow:hidden;
    border:1px solid var(--bordo);box-shadow:var(--ombra);
    background:#fff;animation:fluttua 6s ease-in-out infinite;
  }
  @keyframes fluttua{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .schermo .barra{height:30px;background:#f4f6fc;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid var(--bordo)}
  .schermo .barra i{width:10px;height:10px;border-radius:50%;display:inline-block}
  .schermo .barra i:nth-child(1){background:#ff5f57}
  .schermo .barra i:nth-child(2){background:#febc2e}
  .schermo .barra i:nth-child(3){background:#28c840}
  .schermo .barra span{margin-left:10px;font-size:11px;color:#9aa6c0;font-weight:600}
  .schermo img{display:block;width:100%;height:auto}
  /* sheen che attraversa lo screenshot */
  .schermo::after{
    content:"";position:absolute;top:0;left:-60%;width:50%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);
    transform:skewX(-18deg);animation:sheen 4.5s ease-in-out infinite;pointer-events:none;
  }
  @keyframes sheen{0%,70%{left:-60%}100%{left:130%}}
  /* hotspot pulsante */
  .hotspot{position:absolute;width:26px;height:26px;border-radius:50%;
    border:3px solid var(--blu);background:rgba(47,84,255,.18);
    transform:translate(-50%,-50%);pointer-events:none;}
  .hotspot::before{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--blu);animation:onda 1.8s ease-out infinite}
  @keyframes onda{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}

  /* pannello spiegazione */
  .pannello{background:#fff;border:1px solid var(--bordo);border-radius:var(--r);padding:22px;box-shadow:var(--ombra)}
  .pannello h3{font-size:14px;color:var(--grigio);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px}
  .passo{display:flex;gap:13px;margin-bottom:15px;opacity:0;transform:translateX(14px);animation:passoIn .5s forwards}
  .passo .num{
    width:30px;height:30px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--blu),var(--viola));color:#fff;
    font-weight:800;font-size:14px;display:grid;place-items:center;box-shadow:0 6px 14px rgba(47,84,255,.3)
  }
  .passo p{font-size:14.5px;line-height:1.5;color:#34405e;padding-top:3px}
  .passo p b{color:var(--testo)}
  @keyframes passoIn{to{opacity:1;transform:none}}

  .tip{
    margin-top:6px;display:flex;gap:11px;align-items:flex-start;
    background:linear-gradient(135deg,#fff7e8,#fff);border:1px solid #ffe6b0;
    border-radius:14px;padding:13px 15px;font-size:13.5px;line-height:1.5;color:#7a5b16;
  }
  .tip .ek{font-size:18px;line-height:1}

  /* slide intro / outro */
  .hero{
    background:linear-gradient(150deg,#20307a 0%, #2f54ff 55%, #7b61ff 100%);
    color:#fff;border-radius:26px;padding:48px 42px;box-shadow:var(--ombra);position:relative;overflow:hidden;
  }
  .hero::before{content:"";position:absolute;width:380px;height:380px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);top:-120px;right:-80px}
  .hero .badge{background:rgba(255,255,255,.18);color:#fff}
  .hero h1{font-size:40px;line-height:1.1;margin-bottom:14px;max-width:720px}
  .hero p{font-size:17px;line-height:1.6;color:#dfe5ff;max-width:640px;margin-bottom:26px}
  .hero .azioni{display:flex;gap:12px;flex-wrap:wrap}
  .hero .btn{background:#fff;color:var(--blu-scuro);border:none;font-size:15px;padding:13px 22px}
  .hero .btn.ghost{background:rgba(255,255,255,.14);color:#fff}
  .pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
  .pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600}

  .riepilogo{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:8px}
  @media(max-width:680px){.riepilogo{grid-template-columns:1fr}}
  .rcard{background:#fff;border:1px solid var(--bordo);border-radius:16px;padding:16px 18px;box-shadow:var(--ombra);display:flex;gap:13px;align-items:flex-start}
  .rcard .ic{width:34px;height:34px;border-radius:10px;background:var(--blu-chiaro);display:grid;place-items:center;font-size:17px;flex:none}
  .rcard b{display:block;margin-bottom:3px}
  .rcard small{color:var(--grigio);font-size:13px;line-height:1.45}

  /* ---------- FOOTER NAV ---------- */
  .footer-nav{
    position:fixed;bottom:0;left:0;right:0;z-index:40;
    display:flex;align-items:center;justify-content:center;gap:14px;
    padding:12px;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);
    border-top:1px solid var(--bordo);
  }
  .footer-nav .conta{font-size:13px;font-weight:700;color:var(--grigio);min-width:96px;text-align:center}
  .dots{display:flex;gap:6px}
  .dots i{width:8px;height:8px;border-radius:50%;background:#cdd6f0;cursor:pointer;transition:.2s}
  .dots i.on{background:var(--blu);transform:scale(1.35)}
  .nascondi{display:none!important}

  .hint-tasti{position:fixed;bottom:64px;right:18px;font-size:11px;color:#9aa6c0;background:#fff;border:1px solid var(--bordo);border-radius:10px;padding:6px 10px;z-index:39}
  @media(max-width:760px){nav.indice{display:none}.hint-tasti{display:none}}
</style>
</head>
<body>

<header class="top">
  <div class="logo">
    <div class="mark">P</div>
    <div><b>PaghePro</b><span>STUDIO • GUIDA</span></div>
  </div>
  <div class="titolo-guida">Come usare il software, passo passo</div>
  <div class="spazio"></div>
  <div class="ctrl">
    <label class="toggle"><input type="checkbox" id="vox" checked> Voce narrante</label>
    <button class="btn" id="btnPrev">‹ Indietro</button>
    <button class="btn primary" id="btnPlay"><span class="dot"></span> Riproduci</button>
    <button class="btn" id="btnNext">Avanti ›</button>
  </div>
</header>
<div class="progress-wrap"><div class="progress" id="prog"></div></div>

<div class="shell">
  <nav class="indice" id="indice">
    <h4>SEZIONI</h4>
    <div id="voci"></div>
  </nav>

  <main id="main"><!-- slide iniettate da JS --></main>
</div>

<div class="hint-tasti">Usa ← → per muoverti · Barra spaziatrice per Play</div>

<div class="footer-nav">
  <button class="btn" id="btnPrev2">‹</button>
  <div class="dots" id="dots"></div>
  <div class="conta" id="conta">1 / 16</div>
  <button class="btn" id="btnNext2">›</button>
</div>

<script src="guida-data.js"></script>
<script>
/* =========================================================
   RENDER + NAVIGAZIONE + RIPRODUZIONE CON VOCE
   (i testi delle schede sono in guida-data.js)
   ========================================================= */
const main=document.getElementById('main');
const voci=document.getElementById('voci');
const dots=document.getElementById('dots');
let idx=0, playing=false, timer=null;

// costruisci slide
SLIDES.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'; el.dataset.i=i;
  if(s.tipo==='hero'){
    el.innerHTML=`<div class="hero">
      <span class="badge">GUIDA INTERATTIVA</span>
      <h1>${s.titolo}</h1>
      <p>${s.intro}</p>
      <div class="azioni">
        <button class="btn" onclick="window._play()">▶ Riproduci la guida</button>
        <button class="btn ghost" onclick="window._go(1)">Inizia →</button>
      </div>
      <div class="pills">${s.pills.map(p=>`<span class="pill">${p}</span>`).join('')}</div>
    </div>`;
  } else if(s.tipo==='outro'){
    el.innerHTML=`<span class="badge">${s.icona} ${s.menu}</span>
      <h1>${s.titolo}</h1>
      <p class="tagline">${s.tagline}</p>
      <div class="riepilogo">
        ${s.cards.map(c=>`<div class="rcard"><div class="ic">${c[0]}</div><div><b>${c[1]}</b><small>${c[2]}</small></div></div>`).join('')}
      </div>
      <div class="tip" style="margin-top:18px"><span class="ek">💡</span><div>${s.nota}</div></div>`;
  } else {
    el.innerHTML=`<span class="badge">${s.icona} ${s.menu}</span>
      <h1>${s.titolo}</h1>
      <p class="tagline">${s.tagline}</p>
      <div class="doppia">
        <div class="schermo">
          <div class="barra"><i></i><i></i><i></i><span>PaghePro Studio</span></div>
          <img src="${s.img}" alt="${s.menu}">
          ${s.hotspot?`<div class="hotspot" style="left:${s.hotspot.x}%;top:${s.hotspot.y}%"></div>`:''}
        </div>
        <div class="pannello">
          <h3>Come si fa</h3>
          ${s.passi.map((p,k)=>`<div class="passo" style="animation-delay:${.15+k*.13}s"><div class="num">${k+1}</div><p>${p}</p></div>`).join('')}
          ${s.tip?`<div class="tip"><span class="ek">💡</span><div>${s.tip}</div></div>`:''}
        </div>
      </div>`;
  }
  main.appendChild(el);

  // voce indice
  const v=document.createElement('div');
  v.className='voce'; v.dataset.i=i;
  v.innerHTML=`<span class="ic">${s.icona}</span><span>${s.menu}</span>`;
  v.onclick=()=>go(i);
  voci.appendChild(v);

  // dot
  const d=document.createElement('i'); d.dataset.i=i; d.onclick=()=>go(i); dots.appendChild(d);
});

function render(){
  document.querySelectorAll('.slide').forEach(el=>el.classList.toggle('show', +el.dataset.i===idx));
  // ri-triggera animazioni passi
  const cur=document.querySelector('.slide.show');
  if(cur){ cur.querySelectorAll('.passo').forEach(p=>{p.style.animation='none';p.offsetHeight;p.style.animation='';}); }
  document.querySelectorAll('.voce').forEach(v=>v.classList.toggle('attiva',+v.dataset.i===idx));
  document.querySelectorAll('.dots i').forEach(d=>d.classList.toggle('on',+d.dataset.i===idx));
  const attiva=document.querySelector('.voce.attiva'); if(attiva) attiva.scrollIntoView({block:'nearest'});
  document.getElementById('conta').textContent=`${idx+1} / ${SLIDES.length}`;
  document.getElementById('prog').style.width=((idx)/(SLIDES.length-1)*100)+'%';
}
function go(i){ idx=Math.max(0,Math.min(SLIDES.length-1,i)); render(); if(playing) speakCurrent(); }
function next(auto){ if(idx<SLIDES.length-1){ go(idx+1);} else { stop(); } }
function prev(){ go(idx-1); }

// ---- voce ----
function pickVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith('it'));
  return vs[0]||null;
}
function speakCurrent(){
  clearTimeout(timer);
  const txt=SLIDES[idx].narr||'';
  const useVox=document.getElementById('vox').checked && 'speechSynthesis' in window;
  if(useVox){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt);
    u.lang='it-IT'; u.rate=1; u.pitch=1;
    const v=pickVoice(); if(v) u.voice=v;
    u.onend=()=>{ if(playing) timer=setTimeout(()=>next(true),700); };
    speechSynthesis.speak(u);
  } else {
    // senza voce: tempo proporzionale alla lunghezza del testo
    const ms=Math.max(4200, txt.length*55);
    timer=setTimeout(()=>{ if(playing) next(true); }, ms);
  }
}
function play(){ playing=true; setBtn(); if(idx===SLIDES.length-1) idx=0,render(); speakCurrent(); }
function stop(){ playing=false; setBtn(); clearTimeout(timer); if('speechSynthesis' in window) speechSynthesis.cancel(); }
function setBtn(){ document.getElementById('btnPlay').innerHTML = playing?'<span class="dot"></span> Pausa':'<span class="dot"></span> Riproduci'; }

window._play=play; window._go=go;
document.getElementById('btnPlay').onclick=()=> playing?stop():play();
document.getElementById('btnNext').onclick=()=>{stop();next();};
document.getElementById('btnPrev').onclick=()=>{stop();prev();};
document.getElementById('btnNext2').onclick=()=>{stop();next();};
document.getElementById('btnPrev2').onclick=()=>{stop();prev();};
document.getElementById('vox').onchange=()=>{ if(playing) speakCurrent(); };
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){stop();next();}
  else if(e.key==='ArrowLeft'){stop();prev();}
  else if(e.code==='Space'){e.preventDefault(); playing?stop():play();}
});
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=()=>{}; }
render();
</script>
</body>
</html>
